name: Supabase Keep-Alive

# Mantém o projeto Supabase (plano free) ativo: ele pausa após 7 dias sem
# atividade. Roda na infra do GitHub, sem depender de nenhuma máquina local.

on:
  schedule:
    # Todo dia. O agendador do GitHub atrasa várias horas e pode pular execuções,
    # então a frequência diária deixa margem de sobra até os 7 dias.
    - cron: '17 9 * * *'
  # Permite disparar na mão pelo botão "Run workflow" na aba Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta real no banco (mantém o projeto ativo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # is_username_available é liberada para anon e lê public.profiles, então
          # uma resposta 200 prova que a query rodou de ponta a ponta no Postgres.
          # Os retries cobrem falhas passageiras e o cache vazio de quando o
          # projeto acabou de acordar (404 PGRST205 por alguns minutos).
          resposta=$(curl -sS --max-time 30 \
            --retry 5 --retry-delay 30 --retry-all-errors --fail-with-body \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/is_username_available" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_username":"keepalive_probe"}') || {
            codigo=$?
            if [ "$codigo" = "6" ]; then
              echo "::error::DNS do projeto não resolveu: ele provavelmente está pausado. Restaure no dashboard do Supabase."
            else
              echo "::error::Consulta falhou (curl $codigo): ${resposta}"
            fi
            exit 1
          }

          if [ "$resposta" != "true" ] && [ "$resposta" != "false" ]; then
            echo "::error::Resposta inesperada do banco: ${resposta}"
            exit 1
          fi
          echo "Supabase ativo: consulta real executada no Postgres ✓"
